name: Build and Release Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: '指定版本号 (留空则自动读取最新 Tag 并递增 +0.0.1)'
        required: false
        default: ''
      is_draft:
        description: '是否发布为草稿 (Draft)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  # Job 1: 动态版本计算器 (推送到主分支时版本号自动加 0.0.1)
  version:
    name: Determine Next Release Version (+0.0.1)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc_ver.outputs.version }}
      is_draft: ${{ steps.calc_ver.outputs.is_draft }}
    steps:
      - name: Checkout Code with Full Tag History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version Auto-Increment (+0.0.1)
        id: calc_ver
        run: |
          # 1. 若用户在 workflow_dispatch 中手动指定了版本号，优先使用
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_version }}" ]; then
            CUSTOM_VER="${{ inputs.release_version }}"
            [[ "$CUSTOM_VER" != v* ]] && CUSTOM_VER="v$CUSTOM_VER"
            echo "version=${CUSTOM_VER}" >> $GITHUB_OUTPUT
            echo "is_draft=${{ inputs.is_draft }}" >> $GITHUB_OUTPUT
            echo "Using manual input version: ${CUSTOM_VER}"
            exit 0
          fi

          # 2. 如果直接推送了 Git 标签 (例如 git push origin v1.2.0)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME}"
            echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
            echo "is_draft=false" >> $GITHUB_OUTPUT
            echo "Using pushed tag version: ${TAG_VER}"
            exit 0
          fi

          # 3. 自动计算：拉取已有最新语义化标签 (例如 v1.0.0) 并将 PATCH 版本自动加 1 (+0.0.1)
          git fetch --tags --force || true
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            # 仓库初始第一次自动发布，默认基准设为 v1.0.0
            LATEST_TAG="v1.0.0"
            echo "No existing release tags found, initializing baseline from ${LATEST_TAG}"
          else
            echo "Found latest existing release tag: ${LATEST_TAG}"
          fi

          # 解析 Major.Minor.Patch
          CLEAN_VER="${LATEST_TAG#v}"
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_VER" | cut -d. -f3)

          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # 自动递增 0.0.1 (PATCH + 1)
          NEW_PATCH=$((PATCH + 1))
          NEXT_VER="v${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "version=${NEXT_VER}" >> $GITHUB_OUTPUT
          echo "is_draft=${{ inputs.is_draft || false }}" >> $GITHUB_OUTPUT
          echo "🚀 Next auto-incremented release version (+0.0.1): ${NEXT_VER}"

  # Job 2: 验证与编译 Web 核心静态资产
  build-web:
    name: Build Web Applet
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Build Web Application
        run: npm run build
        env:
          VITE_AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'ap-northeast-1' }}
          VITE_CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # Job 3: 构建 Android APK 安装包
  build-android:
    name: Build Android APK
    needs: [version, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Prepare Environment
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          if [ -d "$SDK_ROOT/cmdline-tools" ]; then
            CMDLINE_BIN=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
            if [ -n "$CMDLINE_BIN" ]; then
              yes | "$CMDLINE_BIN" --licenses 2>/dev/null || true
            fi
          fi

      - name: Initialize Capacitor Android Project
        run: |
          npm install --save-dev --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Sign Android Release (If Keystore Provided)
        if: env.KEYSTORE_SECRET != ''
        id: sign_app
        continue-on-error: true
        uses: r0adkll/sign-android-release@v1
        env:
          KEYSTORE_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS || 'lightsail-key' }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare APK for Release (Ensure Unsigned APK Never Blocked)
        id: prepare_apk
        run: |
          mkdir -p release-output
          APP_VER="${{ needs.version.outputs.version }}"

          echo "Scanning build outputs in android/app/build/outputs/apk/..."
          ls -R android/app/build/outputs/apk/ || true

          # 1. 若配置了密钥且签名成功，发布已签名的正式 APK
          SIGNED_APK=$(find android/app/build/outputs/apk -name "*signed*.apk" | head -n 1)
          if [ -n "$SIGNED_APK" ]; then
            echo "✓ Found production signed APK: $SIGNED_APK"
            cp "$SIGNED_APK" "release-output/Lightsail-Manager-${APP_VER}-signed.apk"
          fi

          # 2. 导出未签名 Release APK (确保无密钥时未签名 APK 正常发布)
          UNSIGNED_APK=$(find android/app/build/outputs/apk -name "*release*.apk" ! -name "*signed*.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            echo "✓ Found unsigned release APK: $UNSIGNED_APK"
            cp "$UNSIGNED_APK" "release-output/Lightsail-Manager-${APP_VER}-unsigned.apk"
          fi

          # 3. 导出开箱即装的通用 APK (自带 Android 测试签名，真机无需配置密钥即可直接安装)
          DEBUG_APK=$(find android/app/build/outputs/apk -name "*debug*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            echo "✓ Found directly installable APK: $DEBUG_APK"
            cp "$DEBUG_APK" "release-output/Lightsail-Manager-${APP_VER}.apk"
          fi

          # 4. 汇总检查
          TOTAL_FILES=$(ls -1 release-output/ 2>/dev/null | wc -l)
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "⚠️ No APK found, packaging web distribution as fallback"
            tar -czf "release-output/Lightsail-Manager-Web-${APP_VER}.tar.gz" -C dist .
          else
            echo "🎉 Successfully prepared release assets:"
            ls -lh release-output/
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightsail-manager-apk
          path: release-output/
          retention-days: 30

  # Job 4: 自动发布 GitHub Release 并上传 APK
  create-release:
    name: Create GitHub Release
    needs: [version, build-web, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: lightsail-manager-apk
          path: release-assets

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: "Lightsail Manager Android ${{ needs.version.outputs.version }}"
          draft: ${{ needs.version.outputs.is_draft == 'true' }}
          prerelease: false
          files: release-assets/*
          body: |
            ### 🚀 AWS Lightsail Manager (Android Edition) ${{ needs.version.outputs.version }}

            #### 🌟 核心功能
            - **暂时删除与休眠（Save Snapshot -> Delete）**：删除实例释放算力前自动生成安全快照，实现 $0 算力计费暂停。
            - **快照极速恢复 & Cloudflare DNS 联动**：一键从快照唤醒实例，并将 AWS 分配的新公网 IP 自动写入 Cloudflare DNS 记录。
            - **定时自动化生命周期**：支持按周配置夜间自动休眠、早晨自动唤醒，内置任务调度守护。
            - **Floci 仿真模拟器**：支持离线及免扣费测试，支持 429 限流/504 超时等异常注入演练。
            - **故障排查诊断控制台**：实时 HTTP 调用日志追踪、连通性一键检查与诊断包导出。

            #### 📱 安装说明
            - 下载下方附带的 `.apk` 文件。
            - 在 Android 手机上打开并允许「安装未知来源应用」即可安装使用。
            - 首次使用支持内置 **Floci 模拟器** 免费体验，亦可在「设置」中填入真实 AWS 与 Cloudflare 凭证。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
